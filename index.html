<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Galaxia · Corazón de Flores Amarillas</title>
    <meta
      name="description"
      content="Una dedicación inmersiva: galaxia dorada, corazón de flores amarillas y un mensaje solo para ti."
    />
    <meta name="theme-color" content="#05040c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Syne:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="galaxy" aria-hidden="true"></canvas>
    <div class="glow" aria-hidden="true"></div>
    <div class="flowers" id="flowers" aria-hidden="true"></div>

    <button class="sound" id="soundBtn" type="button" aria-pressed="false" title="Música">
      <span class="sound__icon" aria-hidden="true">♪</span>
      <span class="sound__label">Música</span>
    </button>

    <!-- Intro -->
    <section class="scene scene--intro is-active" id="sceneIntro" data-scene="intro">
      <p class="scene__kicker">21 de septiembre</p>
      <h1 class="scene__brand">Flores Amarillas</h1>
      <p class="scene__lead">Hay un universo entero esperándote… y un corazón hecho de luz.</p>
      <button class="btn" id="openBtn" type="button">Abrir dedicación</button>
    </section>

    <!-- Galaxia / corazón -->
    <section class="scene scene--heart" id="sceneHeart" data-scene="heart" hidden>
      <div class="heart-title">
        <p class="scene__kicker">Para ti</p>
        <h2 class="scene__headline">Feliz Día de las<br />Flores Amarillas</h2>
        <p class="scene__lead scene__lead--narrow">
          Cada pétalo es un pensamiento. Cada estrella, un deseo.
        </p>
        <button class="btn btn--ghost" id="letterBtn" type="button">Leer tu carta</button>
      </div>
    </section>

    <!-- Carta -->
    <section class="scene scene--letter" id="sceneLetter" data-scene="letter" hidden>
      <article class="letter" role="dialog" aria-labelledby="letterTitle">
        <div class="letter__seal" aria-hidden="true">❀</div>
        <h2 class="letter__title" id="letterTitle">Una flor para ti</h2>
        <div class="letter__body" id="letterBody"></div>
        <p class="letter__sign">Con todo el cariño del universo,</p>
        <p class="letter__from">Quien te dedica este cielo</p>
        <div class="letter__actions">
          <button class="btn btn--ghost" id="backBtn" type="button">Volver a la galaxia</button>
          <button class="btn" id="replayBtn" type="button">Ver de nuevo</button>
        </div>
      </article>
    </section>

    <script src="script.js"></script>
  </body>
</html>
