<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Para Karen Leici · Flores Amarillas</title>
    <meta
      name="description"
      content="Un jardín de flores amarillas dedicado a Karen Leici, con cariño de amistad."
    />
    <meta name="theme-color" content="#f6c84c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="cloud c3"></div>
    </div>

    <div class="petals" id="petals" aria-hidden="true"></div>
    <div class="butterflies" id="butterflies" aria-hidden="true"></div>

    <header class="topbar">
      <p class="topbar__date">21 · septiembre</p>
      <button class="sound" id="soundBtn" type="button" aria-pressed="false">♪ Sonido</button>
    </header>

    <!-- Pantalla 1: bienvenida -->
    <main class="stage stage--welcome is-on" id="welcome">
      <p class="eyebrow">Una dedicatoria especial</p>
      <h1 class="hero-name">
        <span>Karen</span>
        <span>Leici</span>
      </h1>
      <p class="tagline">Hoy el sol floreció pensando en ti.</p>
      <button class="cta" id="bloomBtn" type="button">
        Abrir tu jardín
        <span aria-hidden="true">→</span>
      </button>
    </main>

    <!-- Pantalla 2: jardín -->
    <section class="stage stage--garden" id="garden" hidden>
      <div class="meadow" aria-hidden="true">
        <div class="hill hill-a"></div>
        <div class="hill hill-b"></div>
        <div class="hill hill-c"></div>
      </div>

      <div class="bouquet" id="bouquet" aria-hidden="true">
        <!-- Flores SVG se inyectan por JS -->
      </div>

      <div class="garden-copy">
        <p class="eyebrow eyebrow--dark">Para ti</p>
        <h2 class="garden-title">Feliz Día de las Flores Amarillas</h2>
        <p class="garden-lead">Karen, tu amistad es de esas que iluminan de verdad.</p>
        <button class="cta cta--ink" id="noteBtn" type="button">Leer tu mensaje</button>
      </div>
    </section>

    <!-- Pantalla 3: mensaje -->
    <section class="stage stage--note" id="note" hidden>
      <article class="card">
        <p class="card__stamp">🌻 Para Karen Leici</p>
        <h2 class="card__title">Gracias por ser mi amiga</h2>
        <div class="card__text" id="cardText"></div>
        <p class="card__bye">Con mucho cariño,</p>
        <p class="card__sign">Tu amigo</p>
        <div class="card__row">
          <button class="cta cta--ghost" id="backGarden" type="button">Volver al jardín</button>
          <button class="cta cta--ink" id="againBtn" type="button">Empezar de nuevo</button>
        </div>
      </article>
    </section>

    <script src="script.js"></script>
  </body>
</html>
